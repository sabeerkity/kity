baseURL: "https://sabeerkity.netlify.app/"
languageCode: en-us
title:  Mohammed Sabeer 🦋
theme: PaperMod

menu:
  main:
    - identifier: home
      name: 🏠 Home
      url: /
      weight: 10
    - identifier: whoami
      name: 🐉 Whoami
      url: /whoami
      weight: 20
    - identifier: Certifications
      name: 🥇 certifications
      url: /Certifications
      weight: 30
    - identifier: experience
      name: 💡 Experience
      url: /experience
      weight: 40
    - identifier: search
      name: 🔍 Search
      url: /search
      weight: 50
    # - identifier: tags
    #   name: Tags
    #   url: /tags
    #   weight: 60

params:
  # theme
  showToc: true
  TocOpen: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  hideMeta: false

  # for enchanced SEO
  env: production

  # Home Page
  background_video:
  path: "static/home/Video.mp4"
  autoplay: true
  loop: true
  muted: true
  resolution: "1920x1080"

  profileMode:
    enabled: true
    title: "Mohammed Sabeer"
    subtitle: Hii There..! ✌️ I am Mohammed Sabeer aka Sabeer Kity 🐱‍👤. I'm Currently a **BIM Engineer** 🎓 in **Architecture🏢 and Structure🏗️** Trades. I do **Problem Solving** ☣ and Bring **Efficient Solutions** 🔭 Services and QA/QC on my **Expertise**.
    imageUrl: "home/me3.png"
    imageWidth: 220
    imageHeight: 220
    # buttons:
    #   - name: Resume
    #     url: "https://drive.google.com/file/d/15bupi_Ez5GhhNa2LIT7an1Qxg-0XKYH2/view"

  # List View
  hideDescriptionInList: false

  # cover image for posts
  cover:
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single page

  socialIcons:
    - name: "email"
      url: "mailto:sabeeron95@gmail.com"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/sabeerkity/"
    - name: "github"
      url: "https://github.com/sabeerkity"
    - name: "instagram"
      url: "https://www.instagram.com/sabeer_kity"
    - name: "facebook"
      url: "https://www.facebook.com/mohammed.sabeer.96"
    - name: "twitter"
      url: "https://twitter.com/KitySabeer"
    - name: "Google Developer"
      url: "https://developers.google.com/profile/u/sabeer"
    - name: "reddit"
      url: "https://www.reddit.com/user/sabeerkity"
    - name: "snapchat"
      url: "https://www.snapchat.com/add/sabeer_kity?share_id=iqeKNs4EGLo&locale=en-US"

  # text search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

# for search using Fuse.js
outputs:
  home:
    - HTML
    - RSS
    - JSON

# allow HTML in MD
markup:
  goldmark:
    renderer:
      unsafe: true
